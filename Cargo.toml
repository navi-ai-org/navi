[workspace]
members = [
    "crates/copland",
    "crates/navi-acp",
    "crates/navi-browser",
    "crates/navi-cli",
    "crates/navi-computer-use",
    "crates/navi-core",
    "crates/navi-dart",
    "crates/navi-lite",
    "crates/navi-mcp",
    "crates/navi-napi",
    "crates/navi-openai",
    "crates/navi-os-macos",
    "crates/navi-os-windows",
    "crates/navi-providers",
    "crates/navi-sdk",
    "crates/navi-server",
    "crates/navi-tui",
    "crates/navi-voice",
    "crates/navi-vfs",
]
resolver = "3"
default-members = [
    "crates/copland",
    "crates/navi-acp",
    "crates/navi-browser",
    "crates/navi-cli",
    "crates/navi-computer-use",
    "crates/navi-core",
    "crates/navi-dart",
    "crates/navi-lite",
    "crates/navi-mcp",
    "crates/navi-napi",
    "crates/navi-openai",
    "crates/navi-os-macos",
    "crates/navi-os-windows",
    "crates/navi-providers",
    "crates/navi-sdk",
    "crates/navi-server",
    "crates/navi-tui",
    "crates/navi-voice",
    "crates/navi-vfs",
]

[workspace.package]
version = "0.8.2"
edition = "2024"
license = "Apache-2.0"
description = "Local agentic engine and terminal-first coding agent."
repository = "https://github.com/navi-ai-org/navi"
homepage = "https://github.com/navi-ai-org/navi"
readme = "README.md"

[workspace.dependencies]
copland = { version = "0.8.2", path = "crates/copland" }
anyhow = "1"
async-trait = "0.1"
base64 = "0.22.1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
# Runs the process-wide rustls provider install before `main` (see
# `navi_core::tls`). Already in the dependency graph via napi.
ctor = "1"
directories = "6"
libloading = "0.9"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache", "macros", "underline-color"] }
# reqwest 0.13 has no ring-only TLS feature: `rustls` hard-wires aws-lc-rs
# and `rustls-tls-native-roots` only exists in 0.12. `rustls-no-provider`
# keeps rustls + rustls-platform-verifier while leaving the crypto provider
# to the application; navi-core installs the ring provider process-wide
# (see `navi_core::tls`) so we get ring instead of aws-lc-rs.
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls-no-provider"] }
# Process-wide rustls crypto provider. reqwest's `rustls-no-provider` feature
# needs a provider installed before any Client is built; navi-core installs
# ring (never aws-lc-rs) via this crate.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
jsonschema = { version = "0.47", default-features = false }
proptest = { version = "1.11", default-features = true }
async-stream = "0.3"
futures-util = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
portable-pty = "0.8"
fastrand = "2"
# rmcp 2.2 requires sse-stream >= 0.2.4 (`SseStream::from_bytes_stream`).
# rmcp's `reqwest` feature enables reqwest/rustls (aws-lc-rs); use the
# no-provider variant so rmcp keeps working with the ring provider installed
# by navi-core.
rmcp = { version = "2.2", default-features = false, features = ["client", "transport-child-process", "reqwest-tls-no-provider", "transport-streamable-http-client-reqwest"] }
toml = "1"
# Was pinned to `=0.3.47` for an E0119 conflict with older ratatui-widgets.
# 0.3.53 works with ratatui 0.30 / ratatui-widgets 0.3 in this workspace.
time = "0.3.53"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.2"
warp = "0.3"
tree-sitter = "0.26"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-cpp = "0.23.4"
tree-sitter-css = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-html = "0.23.2"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-php = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
rust-embed = "8.11"
tempfile = "3"
wiremock = "0.6"
# `windows` (not `windows-sys`) is required for UI Automation COM interfaces
# (IUIAutomation, IUIAutomationElement, IUIAutomationTreeWalker, …) used by
# `navi-os-windows` for the `inspect_element` tool. Only pulled in on Windows
# targets via `[target.'cfg(windows)'.dependencies]` in the leaf crate.
windows = { version = "0.62" }
mlua = { version = "0.10", default-features = false, features = ["lua54", "vendored", "serialize"] }
navi-acp = { version = "0.8.2", path = "crates/navi-acp" }
navi-browser = { version = "0.8.2", path = "crates/navi-browser" }
navi-core = { version = "0.8.2", path = "crates/navi-core" }
navi-computer-use = { version = "0.8.2", path = "crates/navi-computer-use" }
navi-dart = { version = "0.8.2", path = "crates/navi-dart" }
navi-mcp = { version = "0.8.2", path = "crates/navi-mcp" }
napi = { version = "3.9.4", features = ["async", "serde-json"] }
napi-build = "2.3.2"
napi-derive = "3.5.7"
navi-openai = { version = "0.8.2", path = "crates/navi-openai" }
navi-os-macos = { version = "0.8.2", path = "crates/navi-os-macos" }
navi-os-windows = { version = "0.8.2", path = "crates/navi-os-windows" }
navi-providers = { version = "0.8.2", path = "crates/navi-providers" }
navi-sdk = { version = "0.8.2", path = "crates/navi-sdk" }
navi-server = { version = "0.8.2", path = "crates/navi-server" }
navi-tui = { version = "0.8.2", path = "crates/navi-tui" }
navi-voice = { version = "0.8.2", path = "crates/navi-voice", default-features = false }
navi-vfs = { version = "0.8.2", path = "crates/navi-vfs" }

# ── Build profiles ──────────────────────────────────────────────────────────
# Dev: fast iterative builds (defaults plus thinner debug info).
[profile.dev]
opt-level = 0
debug = "line-tables-only"
incremental = true
codegen-units = 256
lto = false

# External dependencies don't need debug info for local iteration: dropping it
# shrinks the debug target and the linker input substantially (matters on
# RAM/disk-constrained machines). Workspace crates keep line tables above.
[profile.dev.package."*"]
debug = false

# Release: full optimization for shipping (Cargo defaults: lto=false, codegen-units=16).
# Prefer `cargo build --release` / `just build-release` for distribution binaries.

# Faster local “almost release” binary without thin/fat LTO link cost.
# Use: cargo build --profile release-fast -p navi-cli
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

