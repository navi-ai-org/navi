[package]
name = "navi-os-windows"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Windows OS automation backend (UIA + SendInput + Win32) for NAVI computer use."
repository.workspace = true
homepage.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
] }
# `windows` (full bindings) for UI Automation COM: IUIAutomation,
# IUIAutomationElement, IUIAutomationTreeWalker, IUIAutomationValuePattern,
# plus QueryFullProcessImageNameW for the deny-list target resolver.
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
