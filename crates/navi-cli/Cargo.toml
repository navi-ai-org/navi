[package]
name = "navi-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"

[[bin]]
name = "navi"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
fastrand.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
navi-browser.workspace = true
navi-core.workspace = true
navi-mcp.workspace = true
navi-sdk = { workspace = true, default-features = true }
navi-tui = { workspace = true, default-features = true }
navi-voice = { workspace = true, default-features = false }

[features]
# computer-use is on by default (ADR 0016); the runtime gate
# (`--computer-use` CLI flag or config) still controls tool registration.
default = ["computer-use"]
# OS automation (computer use — ADR 0016).
# Enables the `capture_screen`, `enumerate_windows`, `inspect_element`, and
# `simulate_input` tools behind the `computer-use` feature gate.
computer-use = ["navi-sdk/computer-use", "navi-tui/computer-use"]

[dev-dependencies]
wiremock.workspace = true
portable-pty.workspace = true
