[package]
name = "navi-core"
version = "0.9.0"
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
# Installs the process-wide rustls crypto provider before `main` (see `tls.rs`).
ctor.workspace = true
directories.workspace = true
fastrand.workspace = true
futures-util.workspace = true
jsonschema.workspace = true
navi-browser = { workspace = true, optional = true }
navi-computer-use = { workspace = true, optional = true }
navi-vfs = { workspace = true, optional = true }
reqwest.workspace = true
# `ring` keeps reqwest's `rustls-no-provider` backend working without aws-lc-rs.
rustls.workspace = true
regex.workspace = true
# Rust SQLite engine, wrapped by the synchronous `db` facade. `default-features =
# false` drops mimalloc (a library-level `#[global_allocator]`) and `fts` (Tantivy).
turso = { version = "0.7", default-features = false }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
tokio.workspace = true
toml.workspace = true
# Pinned in the workspace to avoid the E0119 conflict between `time >= 0.3.48` and
# `ratatui-widgets 0.3.x`. Tracked transitively by `tracing-appender`.
time.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
mlua.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true

[features]
# default-off feature set keeps CI/local unit tests and `cargo check -p navi-core`
# to the core capabilities; product binaries opt into capabilities as needed.
default = ["code-vfs", "browser", "computer-use"]
code-vfs = ["dep:navi-vfs"]
browser = ["dep:navi-browser"]
computer-use = ["dep:navi-computer-use"]

[build-dependencies]
anyhow.workspace = true
directories.workspace = true
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar = "0.4"
ureq = { version = "3", default-features = false, features = ["rustls"] }
