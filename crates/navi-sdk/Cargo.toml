[package]
name = "navi-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std"] }
tracing.workspace = true
navi-acp.workspace = true
navi-core.workspace = true
navi-mcp.workspace = true
navi-providers.workspace = true
copland.workspace = true
navi-computer-use = { workspace = true, optional = true }

[features]
default = ["computer-use"]
# OS automation (computer use — ADR 0016). Forwards to
# `navi-core/computer-use` which registers the native tools.
computer-use = ["navi-core/computer-use", "dep:navi-computer-use"]

[dev-dependencies]
tempfile.workspace = true
