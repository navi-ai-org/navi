[package]
name = "navi-napi"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["computer-use"]
# OS automation (computer use — ADR 0016).
computer-use = ["navi-sdk/computer-use"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
napi.workspace = true
napi-derive.workspace = true
# Product N-API surface mirrors the navi-cli binary's engine wiring.
navi-core.workspace = true
navi-sdk = { workspace = true }
serde_json.workspace = true
tokio.workspace = true

[build-dependencies]
napi-build.workspace = true
